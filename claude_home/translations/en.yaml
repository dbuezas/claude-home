configuration:
  main_model:
    name: Model
    description: Handles every request. opus, sonnet or haiku (or a full model name). Opus with low effort was fastest in tests.
  effort:
    name: Effort
    description: Thinking effort of the main model. Lower is faster. "default" uses the model's own default.
  session_idle_minutes:
    name: Conversation memory (minutes)
    description: A conversation keeps its context until it has been idle this long.
  request_timeout:
    name: Request timeout (seconds)
  api_token:
    name: API token
    description: Token the Home Assistant integration uses to call this add-on. Leave empty to auto-generate (shown in the log).
  anthropic_api_key:
    name: Anthropic API key
    description: Optional. Bill Claude to an API key (console.anthropic.com) instead of the subscription login. Takes precedence over the login for voice and chat; Remote Control (app handover) still needs the login. Also settable on the Claude page.
  extra_instructions:
    name: Extra instructions
    description: Appended to the system prompt, e.g. house layout, nicknames for rooms.
  max_level:
    name: Highest access level
    description: 0 = read and Assist only, 1 = "unlock protected entities", 2 = "unlock full access", 3 = "unlock supervisor". Claude asks; your next message must contain the phrase.
  fast_mode:
    name: Fast mode
    description: Keep Claude running between messages (saves ~0.7-0.9 s per message, costs ~120-190 MB of RAM per running Claude).
  fast_keep:
    name: Claudes kept running
    description: At most this many (one is a spare for the next new conversation).
  fast_idle_minutes:
    name: Close unused Claude after (minutes)
  protected_entities:
    name: Protected entities
    description: Entity ids hidden from Assist. Claude can read them, but controlling them needs level 1 ("unlock protected entities"). Easier to manage on the Claude page (Protected tab).
