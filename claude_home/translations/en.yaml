configuration:
  claude_oauth_token:
    name: Claude subscription token
    description: Run `claude setup-token` on any computer with Claude Code and paste the sk-ant-oat… token.
  main_model:
    name: Model
    description: Handles every request. opus, sonnet or haiku (or a full model name). Opus with low effort was fastest in tests.
  effort:
    name: Effort
    description: Thinking effort of the main model. Lower is faster. "default" uses the model's own default.
  session_idle_minutes:
    name: Conversation memory (minutes)
    description: A conversation keeps its context until it has been idle this long.
  request_timeout:
    name: Request timeout (seconds)
  api_token:
    name: API token
    description: Token the Home Assistant integration uses to call this add-on. Leave empty to auto-generate (shown in the log).
  ha_token:
    name: Home Assistant long-lived token
    description: Optional. Only needed if the add-on can't reach HA's MCP server with its built-in Supervisor token.
  extra_instructions:
    name: Extra instructions
    description: Appended to the system prompt, e.g. house layout, nicknames for rooms.
  max_level:
    name: Highest access level
    description: 0 = read and Assist only, 1 = "unlock changes", 2 = "unlock full access", 3 = "unlock supervisor". Claude asks; your next message must contain the phrase.
  protected_entities:
    name: Protected entities
    description: Entity ids hidden from Assist. Claude can read them, but controlling them needs level 1 ("unlock changes"). Easier to manage on the Claude page (Protected tab).
