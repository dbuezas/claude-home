name: Claude Home
version: "0.10.3"
slug: claude_home
description: Claude Code (your Claude subscription) as a Home Assistant conversation agent
url: https://github.com/dbuezas/claude-home
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
hassio_role: manager
ingress: true
ingress_port: 8098
panel_icon: mdi:robot-happy-outline
panel_title: Claude
discovery:
  - claude_home
options:
  claude_oauth_token: ""
  main_model: opus
  effort: low
  protected_entities: []
  max_level: 3
  session_idle_minutes: 15
  request_timeout: 120
schema:
  claude_oauth_token: password
  main_model: str
  session_idle_minutes: int(1,1440)
  request_timeout: int(10,600)
  effort: list(default|low|medium|high|xhigh|max)
  api_token: password?
  ha_token: password?
  extra_instructions: str?
  max_level: int(0,3)
  protected_entities:
    - str
