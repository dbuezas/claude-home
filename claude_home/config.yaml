name: Claude Home
version: "0.4.0"
slug: claude_home
description: Claude Code (your Claude subscription) as a Home Assistant conversation agent and MCP server
url: https://github.com/dbuezas/claude-home
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8098
panel_icon: mdi:robot-happy-outline
panel_title: Claude
discovery:
  - claude_home
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Only needed for remote Claude Code (MCP). Leave empty to keep it internal."
options:
  claude_oauth_token: ""
  main_model: opus
  effort: low
  session_idle_minutes: 15
  request_timeout: 120
schema:
  claude_oauth_token: password
  main_model: str
  session_idle_minutes: int(1,1440)
  request_timeout: int(10,600)
  effort: list(default|low|medium|high|xhigh|max)
  api_token: password?
  ha_token: password?
  extra_instructions: str?
  admin_passcode: password?
  admin_hint: str?
  instructions_passcode: password?
  instructions_hint: str?
